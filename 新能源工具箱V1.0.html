var TOOLS = {
  "coord-transform": {
    name:"2000坐标与经纬度互转", ico:"🌐", tag:"测量",
    desc:"CGCS2000 平面坐标 ↔ 经纬度双向转换，自动识别带号与坐标方向，支持单点与批量转换、CSV 导出。",

    desc:"测量坐标自动颠倒换算生成 CAD 展点命令，支持 Excel/Word 表格直接粘贴、批量出 .scr 脚本。",

  },
  "octagon": {
    name:"风机基础正八边形征地坐标生成器", ico:"⬡", tag:"风机",
    desc:"由机位中心坐标生成正八边形基础 8 角点坐标，输出 CSV 与 CAD 绘图脚本，可选经纬度。",
    file:"tools/风机基础正八边形征地坐标生成器.html"
  },

    file:"tools/XY与AB坐标转换.html"
  },
  "conductor": {
    name:"导线输送容量计算", ico:"🔌", tag:"电气",
    desc:"钢芯铝绞线允许载流量、输送容量、经济电流密度、电压降落与线损计算，依据 DL/T 5582-2020。",
    file:"tools/导线输送容量计算.html"
  },
  "eco-benefit": {
    name:"新能源项目环境效益计算表", ico:"🌱", tag:"环保",
    desc:"年上网电量一键测算节约标准煤、碳粉尘、SO₂、NOₓ、CO₂ 减排量，自动生成成果描述话术。",
    file:"tools/新能源项目环境效益计算表.html"
  },
  "steel-section": {
    name:"热轧型钢截面特性查询", ico:"🏗️", tag:"结构",
    desc:"工字钢、槽钢、角钢、H型钢、HK型钢、剖分T型钢截面尺寸与特性（A/I/i/W/外表面积/重心）查询，依据 GB/T 706-2016 与 GB/T 11263-2024。",
    file:"tools/热轧型钢截面特性查询.html"
  },
  "batch-mkdir": {
    name:"批量新建文件夹", ico:"📁", tag:"实用",
    desc:"批量粘贴文件夹名称，自动校验 Windows 非法字符/重复项并支持子目录，一键生成 .bat 批处理，下载后放到父目录运行即可批量建文件夹。",
    file:"tools/批量新建文件夹.html"
  },
  "snow-wind": {
    name:"雪压风压查询", ico:"🌬️", tag:"查询",
    desc:"GB 50009-2012 表 E.5 全国 667 地区雪压、风压（R=10/50/100）、基本气温与雪荷载分区查询，支持省份级联、关键字过滤与结果复制。",
    file:"tools/雪压风压查询.html"
  }
};

var $ = function(id){ return document.getElementById(id); };
var homeView = $("homeView"), toolFrame = $("toolFrame");
var current = null;   // 当前显示的工具 key，null = 首页

/* ==================== 主题切换 ==================== */
function currentTheme(){
  return document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
}
function syncThemeBtn(){
  var btn = $("themeBtn");
  if (currentTheme() === "light"){
    btn.textContent = "\ud83c\udf19";            // 月亮：点击切回暗色
    btn.title = "切换到暗色科技风";
  } else {
    btn.textContent = "\u2600\ufe0f";            // 太阳：点击切到浅色
    btn.title = "切换到浅色工程风";
  }
}
$("themeBtn").addEventListener("click", function(){
  var t = currentTheme() === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem("nbx-theme", t); } catch (e) {}
  $("themeCss").href = "css/" + t + "/index.css";
  syncThemeBtn();
  /* 工具页在 iframe 内加载时自行读取同一主题设置，这里重载使其生效 */
  if (current !== null) { toolFrame.src = toolFrame.src; }
});
syncThemeBtn();

/* ==================== 首页卡片渲染 ==================== */
function buildCards(){
  var grid = $("toolGrid");
  grid.innerHTML = "";
  Object.keys(TOOLS).forEach(function(key){
    var t = TOOLS[key];
    var card = document.createElement("button");
    card.className = "tool-card";
    card.innerHTML =
      '<div class="tc-head">' +
        '<div class="tc-ico">' + t.ico + '</div>' +
        '<div class="tc-name">' + t.name + '</div>' +
        '<span class="tc-tag">' + t.tag + '</span>' +
      '</div>' +
      '<div class="tc-desc">' + t.desc + '</div>' +
      '<div class="tc-open">打开工具 →</div>';
    card.addEventListener("click", function(){ showPage(key); });
    grid.appendChild(card);
  });
}

/* ==================== 页面切换 ==================== */
function showPage(key){
  var navItems = document.querySelectorAll(".nav-item");
  navItems.forEach(function(btn){
    btn.classList.toggle("active", btn.dataset.page === key);
  });
  if(key === "home" || !TOOLS[key]){
    current = null;
    toolFrame.style.display = "none";
    toolFrame.src = "about:blank";
    homeView.style.display = "block";
    if(location.hash !== "" && location.hash !== "#home"){
      history.replaceState(null, "", "#home");
    }
    return;
  }
  var t = TOOLS[key];
  if(current !== key){
    toolFrame.src = t.file;   // 仅在切换到不同工具时重载，保留各工具运行状态
  }
  current = key;
  homeView.style.display = "none";
  toolFrame.style.display = "block";
  if(location.hash !== "#" + key){
    history.replaceState(null, "", "#" + key);
  }
  document.title = t.name + " · 新能源工具箱";
}

/* 侧栏导航绑定 */
document.querySelectorAll(".nav-item").forEach(function(btn){
  btn.addEventListener("click", function(){ showPage(btn.dataset.page); });
});

/* hash 记忆：刷新 / 直达某个工具 */
function initFromHash(){
  var key = location.hash.replace("#", "");
  showPage(TOOLS[key] ? key : "home");
}
window.addEventListener("hashchange", function(){
  var key = location.hash.replace("#", "");
  showPage(TOOLS[key] ? key : "home");
});

/* ==================== 顶栏时钟 ==================== */
function tick(){
  var d = new Date();
  var p = function(n){ return String(n).padStart(2, "0"); };
  $("clock").textContent =
    d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) +
    " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}
tick();
setInterval(tick, 1000);

/* ==================== 初始化 ==================== */
buildCards();
initFromHash();
})();
</script>


</body></html>
